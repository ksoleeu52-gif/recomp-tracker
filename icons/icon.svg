<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0e1014"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#262b36" stroke-width="15"/>
