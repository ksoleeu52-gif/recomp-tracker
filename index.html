<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app draw under the iPhone notch/home bar; we pad with safe-area insets in CSS. -->
  <!-- interactive-widget: on Android, the on-screen keyboard resizes the page instead of covering it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Recomp</title>
  <meta name="description" content="A fast, offline, ad-free calorie and protein tracker built for body recomposition.">

  <!-- PWA / install metadata -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1014">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS Safari still reads these when the app is added to the home screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recomp">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Screens are rendered into #screen by js/router.js -->
  <main id="screen" class="screen" tabindex="-1"></main>

  <!-- Bottom navigation: thumb-reachable, always visible. -->
  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>Today</span>
    </a>
    <a href="#/foods" data-tab="foods">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/></svg>
      <span>Foods</span>
    </a>
    <a href="#/meals" data-tab="meals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 8.5c0-1.5 1-2 1-3.5M12 8.5c0-1.5 1-2 1-3.5M16 8.5c0-1.5 1-2 1-3.5"/></svg>
      <span>Meals</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast-root" aria-live="polite"></div>

  <noscript><p class="noscript">Recomp needs JavaScript enabled to run.</p></noscript>
</body>
</html>
